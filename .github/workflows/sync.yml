name: Sync habits from Notion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "habit-sync"
          git config user.email "habit-sync@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Sync habits" && git push)
